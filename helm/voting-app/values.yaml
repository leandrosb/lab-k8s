# =============================================================================
# values.yaml — defaults do chart voting-app
# Sobrescreva por ambiente com: helm install -f values-prod.yaml ...
# =============================================================================

# -----------------------------------------------------------------------
# vote — frontend Python para registro de votos
# -----------------------------------------------------------------------
vote:
  image:
    repository: dockersamples/examplevotingapp_vote
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: ClusterIP   # exposto via Gateway API (ALB); veja a seção "gateway" abaixo
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# -----------------------------------------------------------------------
# result — frontend de visualização dos resultados em tempo real
# -----------------------------------------------------------------------
result:
  image:
    repository: dockersamples/examplevotingapp_result
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# -----------------------------------------------------------------------
# worker — consome o Redis e consolida os votos no PostgreSQL (.NET)
# -----------------------------------------------------------------------
worker:
  image:
    repository: dockersamples/examplevotingapp_worker
    tag: latest
    pullPolicy: IfNotPresent
  # Mantenha em 1: o worker não tem lock distribuído para a consolidação;
  # múltiplas réplicas podem duplicar/corromper contagens no Postgres.
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -----------------------------------------------------------------------
# redis — fila/cache temporário entre vote e worker
# -----------------------------------------------------------------------
redis:
  image:
    repository: redis
    tag: alpine
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# -----------------------------------------------------------------------
# postgres (db) — armazenamento persistente dos resultados consolidados
# -----------------------------------------------------------------------
postgres:
  image:
    repository: postgres
    tag: 15-alpine
    pullPolicy: IfNotPresent
  service:
    port: 5432
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi
    # Vazio = usa o StorageClass default do cluster (ex.: gp3 via EBS CSI no EKS)
    storageClassName: ""
  # Se definido, o chart usa esse Secret já existente (chaves POSTGRES_USER,
  # POSTGRES_PASSWORD, POSTGRES_DB) em vez de criar um a partir de `auth` abaixo.
  # Recomendado em produção (Secret vindo de Vault/External Secrets/Sealed Secrets).
  existingSecret: ""
  auth:
    username: postgres
    password: postgres
    database: postgres

# -----------------------------------------------------------------------
# gateway — expõe vote e result via Gateway API (AWS Load Balancer
# Controller), com TLS. Requer as CRDs do Gateway API e o AWS Load Balancer
# Controller já instalados no cluster (ver terraform-eks/README.md).
# -----------------------------------------------------------------------
gateway:
  enabled: true
  # GatewayClass é cluster-scoped (compartilhada). Deixe true na primeira
  # instalação; se outro release já criou uma GatewayClass com esse nome,
  # mude para false.
  createGatewayClass: true
  gatewayClassName: aws-alb
  scheme: internet-facing   # ou "internal" para expor só dentro da VPC
  # Hostnames usados pelo AWS Load Balancer Controller para localizar
  # automaticamente o certificado certo no ACM (descoberta por hostname).
  # Precisam bater com os SANs (dns_names) do certificado gerado em
  # terraform-eks/gateway.tf. Não precisam resolver de verdade em DNS
  # público — só o Host/SNI da requisição precisa bater (veja o README
  # para testar com curl --connect-to ou /etc/hosts).
  voteHostname: vote.voting-app.local
  resultHostname: result.voting-app.local
  # Sem domínio público, vote e result ficam em portas HTTPS separadas no
  # mesmo ALB (mais simples do que rotear por hostname sem DNS real).
  votePort: 443
  resultPort: 8443
