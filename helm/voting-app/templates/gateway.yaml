{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.createGatewayClass }}
# GatewayClass é cluster-scoped (compartilhada por todo o cluster). Se outro
# release já criou uma com esse nome, desative com gateway.createGatewayClass=false.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.gatewayClassName }}
spec:
  controllerName: gateway.k8s.aws/alb
---
{{- end }}
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: {{ include "voting-app.fullname" . }}-lbconfig
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  scheme: {{ .Values.gateway.scheme }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "voting-app.fullname" . }}-gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: {{ include "voting-app.fullname" . }}-lbconfig
  listeners:
    # Sem domínio público (não resolvível), usamos hostnames "falsos" que
    # batem com os SANs do certificado autoassinado (dns_names em
    # terraform-eks/gateway.tf), habilitando a descoberta automática do
    # certificado no ACM. O bloco "tls" é omitido de propósito: o CRD padrão
    # do Gateway API exige certificateRefs/options quando tls.mode=Terminate
    # é declarado explicitamente; deixando tls totalmente ausente, o AWS
    # Load Balancer Controller assume Terminate + descoberta por hostname
    # (é exatamente assim que o exemplo oficial da AWS para esse cenário é
    # escrito).
    - name: https-vote
      hostname: {{ .Values.gateway.voteHostname | quote }}
      protocol: HTTPS
      port: {{ .Values.gateway.votePort }}
      allowedRoutes:
        namespaces:
          from: Same
    - name: https-result
      hostname: {{ .Values.gateway.resultHostname | quote }}
      protocol: HTTPS
      port: {{ .Values.gateway.resultPort }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "voting-app.fullname" . }}-vote
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend-vote
spec:
  parentRefs:
    - name: {{ include "voting-app.fullname" . }}-gateway
      sectionName: https-vote
  rules:
    - backendRefs:
        - name: {{ include "voting-app.fullname" . }}-vote
          port: {{ .Values.vote.service.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "voting-app.fullname" . }}-result
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend-result
spec:
  parentRefs:
    - name: {{ include "voting-app.fullname" . }}-gateway
      sectionName: https-result
  rules:
    - backendRefs:
        - name: {{ include "voting-app.fullname" . }}-result
          port: {{ .Values.result.service.port }}
{{- end }}
